server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip the usual text-based asset types — meaningfully smaller
    # transfer size for the JS bundles Vite produces.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Long-lived caching for hashed build assets (Vite fingerprints every
    # file in dist/assets, e.g. index-CC3FRpqq.js — the hash changes
    # whenever the content does, so caching these aggressively is safe:
    # a new deploy produces new filenames, never silently serves stale JS).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else falls back to index.html — this is the single most
    # important line in this file. Without it, refreshing the browser on
    # any client-side route (e.g. /change-requests, /admin, /decisions)
    # would ask nginx for a literal file at that path, get a 404, and the
    # app would appear completely broken on every deep link and every
    # refresh — a static file server has no idea /change-requests is a
    # React Router route rather than a real file, only index.html +
    # client-side JS does.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached — it's the one file whose
    # content changing is exactly how the browser finds out about a new
    # deploy (it references the new hashed asset filenames).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
