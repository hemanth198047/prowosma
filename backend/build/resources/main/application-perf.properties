# MongoDB Atlas ? connection pool optimised
spring.mongodb.auto-index-creation=true

# MongoDB connection pool (Atlas free tier: 100 max connections)
# spring.mongodb.uri is already set ? these tune it
spring.mongodb.min-connections-per-host=2
spring.mongodb.max-connections-per-host=20
spring.mongodb.connections-per-host=20
spring.mongodb.connect-timeout=5000
spring.mongodb.server-selection-timeout=10000

# Tomcat thread pool
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=50
server.tomcat.max-connections=200

# HTTP compression ? saves bandwidth, feels faster to users
server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/html,text/css
server.compression.min-response-size=1024

# Response caching headers
spring.web.resources.cache.cachecontrol.max-age=3600
spring.web.resources.cache.cachecontrol.must-revalidate=true

# Actuator ? health + metrics (keep lightweight)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# Logging ? reduce noise in production
logging.level.org.springframework.data.mongodb.core=WARN
logging.level.org.springframework.web=WARN
logging.level.org.mongodb.driver=WARN

# Banner off (tiny startup speedup)
spring.main.banner-mode=off