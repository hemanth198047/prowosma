# Local-dev / self-hosted Prometheus config — scrapes the backend's real
# /actuator/prometheus endpoint (which already existed before this item;
# nothing new needed on the app side) and evaluates the alert rules in
# alert-rules.yml. Previously there was no Prometheus instance anywhere in
# this project actually scraping that endpoint, so metrics existed but
# nothing was watching them.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prowosma-backend"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:9090"]
