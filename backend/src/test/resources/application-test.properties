# Embedded MongoDB for tests ? Flapdoodle handles this automatically
# Override any prod settings that would fail in test
spring.mongodb.uri=mongodb://localhost:27017/prowosma_test
# Flapdoodle no longer infers a default version ? it must be pinned explicitly
# or embedded Mongo startup fails with "Set the de.flapdoodle.mongodb.embedded.version property"
de.flapdoodle.mongodb.embedded.version=7.0.5
# AWS Secrets Manager auto-config tries to build a client at startup and fails
# without an AWS region configured anywhere in this environment. Not used in
# tests, so disable it outright rather than fake a region.
spring.cloud.aws.secretsmanager.enabled=false
# Redis isn't running in this test environment and nothing here tests Redis
# directly ? without this, Spring Boot Actuator's aggregated /actuator/health
# reports overall status DOWN (503) purely because the Redis health indicator
# can't connect, which breaks any test hitting /actuator/health.
management.health.redis.enabled=false
jwt.secret=test-secret-key-must-be-at-least-32-chars-long
jwt.expiration=3600000
spring.mail.host=localhost
spring.mail.port=3025
# Disable SAML in tests
saml.idp.okta.metadata-url=
saml.idp.azure.metadata-url=
saml.idp.google.metadata-url=
management.health.mail.enabled=false