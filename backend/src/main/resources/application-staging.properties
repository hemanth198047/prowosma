# Activated via SPRING_PROFILES_ACTIVE=staging.
#
# Staging exists to catch configuration mistakes — a missing secret, a
# wrong CORS origin, a connection string pointing at the wrong database —
# BEFORE they reach production, not after. That only works if staging is
# held to the same configuration discipline as production: every setting
# that application-prod.properties refuses to silently default is refused
# here too. If staging "just works" with nothing set, it isn't actually
# validating anything about your real deployment configuration.
#
# See application-prod.properties for the detailed reasoning behind each
# of these; it's identical here, just for the staging environment instead.
jwt.secret=${JWT_SECRET}
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGO_DB}
app.frontend.url=${FRONTEND_URL}
app.cors.allowed-origins=${CORS_ORIGINS}
