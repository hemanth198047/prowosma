# Activated only when the "prod" profile is explicitly active (see
# SPRING_PROFILES_ACTIVE) — NOT automatically implied by the "docker"
# profile alone, so `docker compose up` for local testing still works with
# zero setup. This file exists for exactly one reason:
#
# application.properties' jwt.secret has a fallback default
# ("prowosma-dev-secret-key-...") that's fine for local dev but was
# flagged as a real vulnerability if it ever silently carried into a real
# deployment: that fallback value is published in this very repository, so
# any JWT signed with it is forgeable by anyone who has ever seen this
# source code. The dangerous failure mode isn't "the app crashes" — it's
# "the app starts up looking completely fine and quietly issues forgeable
# tokens forever."
#
# Overriding it here with NO default value flips that failure mode: Spring
# Boot's placeholder resolution throws at startup
# ("Could not resolve placeholder 'JWT_SECRET'") if the real environment
# variable isn't actually set, refusing to start rather than silently
# running insecurely. A loud, immediate, impossible-to-miss startup crash
# is the correct behavior here, not a graceful fallback.
jwt.secret=${JWT_SECRET}

# ── The same reasoning applies to these — application.properties'
# defaults for all four are deliberately dev-friendly (localhost Mongo,
# localhost frontend, localhost CORS origins), which is exactly what you
# want for `npm run dev` / local testing and exactly what you do NOT want
# silently carrying into production:
#
#   - spring.mongodb.uri/database: defaulting to localhost in prod means
#     either the app fails to connect to anything (best case) or, if the
#     production server happens to have SOME local MongoDB running for
#     unrelated reasons, real customer data silently gets written to the
#     wrong database (worst case, and much harder to notice).
#   - app.frontend.url: used to build links in transactional emails
#     (invitations, password resets). Left as localhost in prod, real
#     customers receive emails with links that only work on someone's
#     laptop.
#   - app.cors.allowed-origins: left as localhost in prod, the real
#     production frontend's domain gets CORS-blocked outright — the whole
#     app simply doesn't work. Loud rather than silent, but still exactly
#     the kind of thing that should be caught by a failed deployment, not
#     discovered by a customer.
#
# See infra/setup-mongodb.bat for the guided way to set these when
# standing up a production (or staging) environment.
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGO_DB}
app.frontend.url=${FRONTEND_URL}
app.cors.allowed-origins=${CORS_ORIGINS}
