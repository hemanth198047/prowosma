# ??????????????????????????????????????????????????????????????????????????????
# Prowosma ? application configuration
# ??????????????????????????????????????????????????????????????????????????????

spring.application.name=${APPLICATION_NAME:prowosma-backend}
server.port=9090

# ?? MongoDB ???????????????????????????????????????????????????????????????????
# SECURITY: this used to have a live password hardcoded here. That password
# has been shared outside your control (it was in a zip handed to a third
# party) ? treat it as compromised: rotate it in MongoDB Atlas, then set the
# new connection string as the MONGODB_URI environment variable before
# starting the app. There is no working default here on purpose.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.mongodb.database=${MONGO_DB:prowosma}

# ?? AWS Secrets Manager (opt-in) ????????????????????????????????
# The secrets-manager starter dependency (see build.gradle) only actually
# resolves any config FROM AWS when spring.config.import references an
# aws-secretsmanager: source, which nothing here does by default - that
# part is genuinely opt-in. But Spring Cloud AWS 3.x's own
# SecretsManagerAutoConfiguration builds its SecretsManagerClient bean
# unconditionally whenever the dependency is on the classpath at all
# (its @ConditionalOnProperty defaults to enabled, matchIfMissing=true),
# independently of that import mechanism - so without this explicit
# opt-out, startup fails everywhere AWS_REGION isn't set, which is every
# local/non-AWS environment. Set AWS_SECRETS_MANAGER_ENABLED=true (and
# AWS_REGION) only where this integration is actually being used.
spring.cloud.aws.secretsmanager.enabled=${AWS_SECRETS_MANAGER_ENABLED:false}

# ?? JWT ??????????????????????????????????????????????????????????
# SECURITY: the fallback default below is a real, working secret that is
# published in this repository ? safe for local dev (zero-setup), but if
# JWT_SECRET is ever left unset in a real deployment, tokens become
# forgeable by anyone who has seen this source. The "prod" Spring profile
# (see application-prod.properties) overrides this with no fallback at
# all, so a real deployment missing JWT_SECRET fails loudly at startup
# instead of silently running with a known-public secret.
jwt.secret=${JWT_SECRET:prowosma-dev-secret-key-min-64-chars-do-not-use-in-production-xxxxxxxx}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ?? Email ? any SMTP-compatible provider ?????????????????????????????
# Fully generic SMTP config ? works unchanged for Amazon SES, SendGrid,
# Postmark, Mailgun, a self-hosted mail relay, or Gmail (the previous
# default). Switching providers is a pure env-var change; see
# docs/EMAIL_SETUP.md for exact host/port values per provider and how to
# wire bounce/complaint webhooks for each.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
# SECURITY: this used to have a live Gmail app password hardcoded here. That
# password has been shared outside your control ? revoke it at
# https://myaccount.google.com/apppasswords, generate a new one, and set it
# via SMTP_PASSWORD below. No working default here on purpose; email
# sending fails loudly instead of silently using a leaked credential.
spring.mail.username=${SMTP_USERNAME:${GMAIL_USERNAME:}}
spring.mail.password=${SMTP_PASSWORD:${GMAIL_APP_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Sender identity shown in emails
app.from.email=${SMTP_FROM_EMAIL:${GMAIL_USERNAME:}}
app.from.name=${SMTP_FROM_NAME:Prowosma}

# ?? Resend (https://resend.com) ? HTTPS-API email transport ??????????
# Optional. When set, EmailService sends server-default emails (invites,
# magic links, digests) through Resend's HTTPS API instead of the SMTP
# config above. This matters on hosts that block outbound SMTP ports ?
# Render's free web-service tier, for example, blocks 25/465/587 entirely,
# which makes the spring.mail.* SMTP settings above fail with a connection
# timeout no matter how correct SMTP_USERNAME/SMTP_PASSWORD are. Resend
# sends over plain HTTPS instead, so it isn't affected.
# Leave unset to keep using SMTP exactly as before (e.g. on a paid Render
# instance, or any host that doesn't block SMTP ports).
resend.api.key=${RESEND_API_KEY:}

# Shared-secret signature check for the SendGrid/Postmark bounce webhook
# (see EmailWebhookController) ? leave blank only in local dev; required
# in any environment those webhooks are actually reachable from the
# internet. SES verifies via SNS message signatures instead (no shared
# secret needed) ? see docs/EMAIL_SETUP.md.
email.webhook.shared-secret=${EMAIL_WEBHOOK_SECRET:}

# ?? Field-level encryption for sensitive stored values ???????????????
# Currently protects: WorkspaceConfig.smtpPassword. Unset (default):
# stored as plaintext, identical to prior behavior ? zero risk to any
# environment that hasn't opted in yet. Set for real deployments ? see
# docs/SECURITY_HARDENING.md for key generation and rotation guidance.
security.field-encryption-key=${ENCRYPTION_KEY:}

# ?? Frontend URL ??????????????????????????????????????????????????????????????
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# The physical region THIS deployment instance actually runs in ? set this
# to match wherever the app + its MongoDB Atlas cluster are really hosted.
# Used by AdminController's data-residency status check to flag workspaces
# whose declared dataRegion doesn't match reality, instead of silently
# implying residency compliance that this single-connection-string
# deployment doesn't actually enforce. See Workspace.dataRegion's doc
# comment for the full explanation of what is and isn't implemented here.
app.deployment.region=${DEPLOYMENT_REGION:US}

# ?? CORS & WebSocket ??????????????????????????????????????????????????????????
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
app.websocket.allowed-origins=${WS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# STOMP broker relay (real deployments only ? see WebSocketConfig /
# WebSocketTestConfig). Defaults to localhost (for running RabbitMQ
# directly, non-Docker) ? docker-compose.yml explicitly overrides
# RABBITMQ_STOMP_HOST to the "rabbitmq" service name, the same pattern
# already used for MONGODB_URI/CORS_ORIGINS/etc. there. RabbitMQ's own
# STOMP plugin defaults (port 61613, guest/guest) ? override
# RABBITMQ_STOMP_LOGIN/PASSCODE for anything but local dev, the same way
# every other credential in this file works.
app.websocket.broker-relay-enabled=${WEBSOCKET_BROKER_RELAY_ENABLED:false}
app.websocket.relay-host=${RABBITMQ_STOMP_HOST:localhost}
app.websocket.relay-port=${RABBITMQ_STOMP_PORT:61613}
app.websocket.relay-login=${RABBITMQ_STOMP_LOGIN:guest}
app.websocket.relay-passcode=${RABBITMQ_STOMP_PASSCODE:guest}

# Redis ? shared store for DocCollabController's presence tracking (see
# that file). Auto-configured by spring-boot-starter-data-redis once these
# are set; no separate RedisConfig class needed for this usage.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ?? File storage ?????????????????????????????????????????????????
# FILE_STORAGE_PROVIDER=local (default, unchanged prior behavior) or
# =s3 (Amazon S3, or any S3-compatible service ? MinIO/R2/B2/Spaces via
# FILE_STORAGE_S3_ENDPOINT). Switching is a config change only, no code
# change ? see docs/FILE_STORAGE_SETUP.md.
file.storage.provider=${FILE_STORAGE_PROVIDER:local}
file.upload.dir=${FILE_UPLOAD_DIR:uploads}
file.max.size=10485760
file.storage.s3.bucket=${FILE_STORAGE_S3_BUCKET:}
file.storage.s3.region=${FILE_STORAGE_S3_REGION:us-east-1}
# Leave blank for real AWS S3. Set for an S3-compatible service, e.g.
# http://localhost:9000 for a local MinIO instance.
file.storage.s3.endpoint=${FILE_STORAGE_S3_ENDPOINT:}
file.storage.s3.key-prefix=${FILE_STORAGE_S3_KEY_PREFIX:attachments/}

# Malware scanning for uploaded attachments ? off by default (every
# upload is treated as clean) so local dev doesn't require a running
# clamd. Set VIRUS_SCAN_PROVIDER=clamav + CLAMAV_HOST/CLAMAV_PORT to
# enable ? see docs/FILE_STORAGE_SETUP.md for a docker-compose snippet.
virus-scan.provider=${VIRUS_SCAN_PROVIDER:none}
virus-scan.clamav.host=${CLAMAV_HOST:localhost}
virus-scan.clamav.port=${CLAMAV_PORT:3310}
virus-scan.clamav.timeout-ms=${CLAMAV_TIMEOUT_MS:15000}
# If the scanner is unreachable: false (default) logs a warning and lets
# the upload through unscanned (fail-open); true rejects the upload
# instead (fail-closed) ? set true once ClamAV is a hard production
# requirement rather than a defense-in-depth layer.
virus-scan.fail-closed=${VIRUS_SCAN_FAIL_CLOSED:false}

# ?? SAML SSO (optional ? leave blank to disable) ?????????????????????????????
saml.idp.okta.metadata-url=${SAML_OKTA_METADATA_URL:}
saml.idp.azure.metadata-url=${SAML_AZURE_METADATA_URL:}
saml.idp.google.metadata-url=${SAML_GOOGLE_METADATA_URL:}
saml.idp.custom.metadata-url=${SAML_CUSTOM_METADATA_URL:}
saml.idp.custom.registration-id=${SAML_CUSTOM_REG_ID:custom}

# ?? Swagger / OpenAPI ?????????????????????????????????????????????????????????
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.groups-order=DESC
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.show-actuator=false

# ?? Rate limiting ?????????????????????????????????????????????????????????????
app.rate-limit.requests-per-minute=${RATE_LIMIT_RPM:300}

# Auth0 (backend ID token verification) - domain/audience must match the
# frontend's Auth0Provider config in main.jsx. These defaults match what's
# already hardcoded there; override via env vars for a different tenant.
auth0.domain=${AUTH0_DOMAIN:dev-k7wl42wvci7bojg2.us.auth0.com}
auth0.audience=${AUTH0_CLIENT_ID:3xp1SBwmgZHaibd0HLGNrRR1T0ZBpaHs}

# ?? Stripe Billing (bring-your-own-key, same pattern as the AI providers) ???????
# Leave blank to run with billing disabled (everyone stays on the FREE plan,
# and /api/billing/checkout returns a clear "payments aren't configured" error
# instead of failing silently). To go live:
#   1. Create a Stripe account at https://dashboard.stripe.com
#   2. Developers -> API keys -> copy the Secret key -> STRIPE_SECRET_KEY
#   3. Products -> Add Product -> Recurring price, per seat, for each paid
#      plan -> copy each Price ID (starts with "price_") below
#   4. Developers -> Webhooks -> Add endpoint -> https://your-domain/api/webhooks/stripe
#      -> select: checkout.session.completed, customer.subscription.created,
#      customer.subscription.updated, customer.subscription.deleted,
#      invoice.paid, invoice.payment_failed -> copy the signing secret -> STRIPE_WEBHOOK_SECRET
# See SETUP_BILLING.md for the full walkthrough, including local testing with the Stripe CLI.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.price.pro=${STRIPE_PRICE_PRO:}
stripe.price.business=${STRIPE_PRICE_BUSINESS:}
stripe.price.enterprise=${STRIPE_PRICE_ENTERPRISE:}

# ?? Observability ????????????????????????????????????????????????
# None of this existed before ? no metrics endpoint, no tracing
# configuration, nothing for a monitoring platform to scrape. See
# HealthController (already existed) for the hand-built /api/health/*
# endpoints that predate this section; /actuator/* below is the standard,
# tool-recognized surface most monitoring platforms expect instead of a
# custom one.
#
# Only expose the specific endpoints actually needed ? Actuator's full
# endpoint set includes things like /actuator/env and /actuator/beans that
# can leak configuration details; opt-in to a short allowlist rather than
# opt-out of everything.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
# Tags every exported metric with which app/instance produced it ? needed
# the moment more than one instance exists behind a load balancer, so
# metrics from instance A and instance B don't get silently merged.
management.metrics.tags.application=prowosma-backend
management.metrics.tags.region=${DEPLOYMENT_REGION:US}

# ?? Data residency ? real per-region routing infrastructure (opt-in) ??
# Leave all four unset (default) for the existing single-database
# behavior ? zero change. Set one or more to give this deployment a real,
# distinct MongoDB connection for that region, which WorkspaceService then
# requires before it will let a workspace declare that region (see
# WorkspaceService.update() and docs/DATA_RESIDENCY.md).
data-region.mongodb-uri.us=${MONGODB_URI_US:}
data-region.mongodb-uri.eu=${MONGODB_URI_EU:}
data-region.mongodb-uri.uk=${MONGODB_URI_UK:}
data-region.mongodb-uri.apac=${MONGODB_URI_APAC:}
# Allows declaring a region with no backing infrastructure as an
# advisory-only statement of intent, instead of being rejected outright ?
# an explicit opt-in for a deployment that's mid-migration to real
# regional infrastructure. Default false: an unenforceable region
# declaration is rejected, not silently accepted.
data-region.allow-unenforced=${ALLOW_UNENFORCED_DATA_REGION:false}

# ?? Web Push (VAPID) ? optional ???????????????????????????????????
# Generate a real key pair with: npx web-push generate-vapid-keys
# Unset (default): push subscribe/send endpoints return 503/no-op ? the
# service worker can still receive a push if one is ever sent by another
# means, but this app can't send one. See docs/MOBILE_OFFLINE.md.
push.vapid.public-key=${VAPID_PUBLIC_KEY:}
push.vapid.private-key=${VAPID_PRIVATE_KEY:}
push.vapid.subject=${VAPID_SUBJECT:mailto:support@example.com}

# Distributed tracing ? fully config-driven, no code change needed to point
# this at a real collector/vendor. See docs/OBSERVABILITY_SETUP.md for the
# exact recipe for Jaeger, Grafana Tempo/Cloud, Honeycomb, Datadog, and New
# Relic. `docker compose up` now starts a local OTel Collector + Jaeger so
# this is genuinely verifiable end-to-end out of the box, not just wiring
# that trusts a collector exists somewhere.
#
# Sampling: 100% by default (fine for dev/low traffic and for verifying the
# pipeline end-to-end). Override via OTEL_TRACING_SAMPLING_PROBABILITY
# before pointing this at real production traffic, where 100% sampling
# gets expensive fast against most paid trace backends.
management.tracing.sampling.probability=${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.tracing.timeout=${OTLP_TRACING_TIMEOUT:10s}
management.otlp.tracing.compression=${OTLP_TRACING_COMPRESSION:gzip}
# Same "environment" tag already applied to metrics below is the reliable,
# version-independent way to distinguish traffic from multiple deployment
# environments (dev/staging/prod) hitting the same collector/backend ? see
# docs/OBSERVABILITY_SETUP.md for the metrics + traces distinction and why
# this repo doesn't also guess at an OTel-resource-attribute property name
# that may not match every Spring Boot Actuator version.
management.metrics.tags.environment=${DEPLOYMENT_ENV:development}

# Optional auth header for hosted trace backends that require one
# (Honeycomb, Grafana Cloud, some Datadog/New Relic OTLP endpoints all
# require an API-key-bearing header). Format: "Header-Name=value". Only
# ONE header is supported through this single env var by design ? most
# vendors need exactly one (an API key or a Basic auth value); see
# TracingConfig.java + docs/OBSERVABILITY_SETUP.md if a vendor genuinely
# needs more than one header, which is uncommon.
otlp.tracing.auth-header=${OTLP_TRACING_AUTH_HEADER:}